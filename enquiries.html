<!DOCTYPE html>
<html lang="en">
<head>
    <!-- SECTION 3.1: On-Page SEO Essentials -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Cake Enquiries | House Of Crumbs Bakery</title>
    <meta name="description" content="Enquire about custom cakes for birthdays, weddings, or special events with House of Crumbs. Fill out our form to receive a quick quote and availability updates.">
    
    <link rel="stylesheet" href="styles.css">
    
    <!-- JavaScript Link (Deferred tracking) -->
    <script src="java.js" defer></script>
</head>
<body>
     <header class="hero">
    <div class="top-bar">
        <div>
            <!-- SECTION 3.1: Image Optimization - Added meaningful alt description -->
            <img src="img/Logo.png" width="120" class="logo" alt="House Of Crumbs Bakery Official Logo">
        </div>

        <!-- NAVIGATION -->
        <nav class="navbar">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about_us.html" class="nav-link">About</a>
            <a href="enquiries.html" class="nav-link">Enquiries</a>
            <a href="shop_now.html" class="nav-link">Shop</a>
            <a href="contact_us.html" class="nav-link">Contact</a>
        </nav>
    </div>

    <div class="hero-content">
        <div class="hero-text">
            <h1>House Of Crumbs</h1>
            <p>WE BAKE 4 U</p>
        </div>
    </div>
</header>

    <!-- SECTION 2.1: Integrated animation class "fade-in" for smooth page loading transition -->
    <main class="form-container fade-in">
        <!-- SECTION 4.1: Form ID and Explicit Submission Attributes -->
        <form class="enquiry-form" id="enquiryForm" action="https://jsonplaceholder.typicode.com/posts" method="POST">
            
            <h2>Enquiry Form</h2>

            <!-- Dynamic Error Feedback Boxes (Section 4.1 JavaScript Client-Side Validation validation targets) -->
            <div id="enquiryError" style="color: #ff3333; font-weight: bold; margin-bottom: 15px; display: none; text-align: center;"></div>
            <div id="enquirySuccess" style="color: #2baf2b; font-weight: bold; margin-bottom: 15px; display: none; text-align: center;"></div>

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required minlength="2">
            </div>

            <div class="form-group">
                <label for="surname">Surname:</label>
                <input type="text" id="surname" name="surname" placeholder="Enter your surname" required minlength="2">
            </div>

            <!-- SECTION 4.1 Validation Target: Email Address validation criteria -->
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <!-- SECTION 4.1 Validation Target: Phone structure (Exactly 10 numerical characters) -->
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g. 0821234567" required pattern="[0-9]{10}">
            </div>

            <!-- SECTION 4.1 Validation Target: Date matching requirements -->
            <div class="form-group">
                <label for="eventDate">Date of Event:</label>
                <input type="date" id="eventDate" name="eventDate" required>
            </div>

            <div class="form-group">
                <label for="reason">Reason / Event Type:</label>
                <select name="reason" id="reason">
                    <option value="Birthday">Birthday</option>
                    <option value="Wedding">Wedding</option>
                    <option value="Custom Cake">Custom Cake</option>
                </select>
            </div>

            <div class="form-group">
                <label for="details">Order Details:</label>
                <textarea id="details" name="details" placeholder="Tell us more about your order..." rows="5" required></textarea>
            </div>

            <button type="submit">Submit Enquiry</button>
        </form>
    </main>

    <footer class="footer">
       <!--footer-->
       <hr>
       <div class="footer-info" style="text-align: center;">
           HOUSE OF CRUMBS<br>
           <!-- SECTION 2.1: Advanced DOM Manipulation Hook to render year automatically -->
           &copy; <span id="currentYear"></span> copyright reserved<br>
           <small><a href="mailto:MAISONDECRUMBS@gmail.com">MAISONDECRUMBS@gmail.com</a></small> 
         <p>
            <a href="index.html">Home</a>  | 
            <a href="about_us.html">About</a> | 
            <a href="contact_us.html">Contact</a>
         </p>
       </div>
    </footer>  
</body>
</html>
